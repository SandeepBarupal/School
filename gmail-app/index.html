<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudMail - Professional Email Client</title>
  <meta name="description" content="CloudMail is a modern, professional email application with a clean interface, powerful search, and smart organization.">
  <meta name="keywords" content="email, mail, cloudmail, inbox, webmail">
  <meta name="author" content="CloudMail">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/refresh.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">
        <span class="material-icons-outlined loading-icon">cloud</span>
        <span class="loading-text">CloudMail</span>
      </div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
  </div>

  <!-- Auth Container -->
  <div id="auth-container" style="display:none">
    <div id="auth-content"></div>
  </div>

  <!-- Main App Container -->
  <div id="app-container" style="display:none">

    <!-- Top Header -->
    <header id="app-header">
      <div class="header-left">
        <button id="menu-toggle" class="icon-btn" title="Main menu" aria-label="Toggle sidebar">
          <span class="material-icons-outlined">menu</span>
        </button>
        <a href="index.html?page=mail&amp;folder=inbox" class="logo-link" id="logo-link">
          <span class="material-icons-outlined logo-icon">cloud</span>
          <span class="logo-text">CloudMail</span>
        </a>
      </div>
      <div class="header-center">
        <div class="search-container" id="search-container">
          <span class="material-icons-outlined search-icon">search</span>
          <input type="text" id="search-input" placeholder="Search mail" autocomplete="off" aria-label="Search mail">
          <button id="search-options-btn" class="icon-btn" title="Show search options">
            <span class="material-icons-outlined">tune</span>
          </button>
          <div id="search-dropdown" class="search-dropdown" style="display:none"></div>
        </div>
      </div>
      <nav id="top-navigation" class="top-navigation" aria-label="Main pages">
        <button class="top-nav-link active" data-page="mail" data-folder="inbox"><span class="material-icons-outlined">inbox</span><span>Inbox</span></button>
        <button class="top-nav-link" data-page="contacts"><span class="material-icons-outlined">people</span><span>People</span></button>
        <button class="top-nav-link" data-page="calendar"><span class="material-icons-outlined">calendar_month</span><span>Calendar</span></button>
        <button class="top-nav-link" data-page="tasks"><span class="material-icons-outlined">task_alt</span><span>Tasks</span></button>
      </nav>
      <div class="header-right">
        <div class="sync-status"><span class="sync-pulse"></span><span>Updated just now</span></div>
        <button id="help-btn" class="icon-btn" title="Notifications" aria-label="Notifications">
          <span class="material-icons-outlined">notifications_none</span>
        </button>
        <button id="header-settings-btn" class="icon-btn" title="Quick settings" aria-label="Quick settings">
          <span class="material-icons-outlined">settings</span>
        </button>
        <button id="apps-btn" class="icon-btn" title="CloudMail apps" aria-label="CloudMail apps">
          <span class="material-icons-outlined">apps</span>
        </button>
        <button id="user-avatar-btn" class="avatar-btn" title="Account" aria-label="Account menu">
          <div class="avatar" id="header-avatar">S</div>
        </button>
      </div>
    </header>

      <!-- App switcher rail -->
      <aside id="app-rail" aria-label="App shortcuts">
        <button class="rail-brand" data-page="mail" data-folder="inbox" title="CloudMail"><span class="material-icons-outlined">grid_view</span></button>
        <div class="rail-divider"></div>
        <button class="rail-link active" data-page="mail" data-folder="inbox" title="Mail"><span class="material-icons-outlined">mail</span></button>
        <button class="rail-link" data-page="contacts" title="Contacts"><span class="material-icons-outlined">contacts</span></button>
        <button class="rail-link" data-page="calendar" title="Calendar"><span class="material-icons-outlined">calendar_month</span></button>
        <button class="rail-link" data-page="keep" title="Notes"><span class="material-icons-outlined">lightbulb</span></button>
        <button class="rail-link" data-page="tasks" title="Tasks"><span class="material-icons-outlined">task_alt</span></button>
        <span class="rail-spacer"></span>
        <button class="rail-link" data-page="settings" title="Settings"><span class="material-icons-outlined">settings</span></button>
        <button class="rail-profile" id="rail-profile" title="Account"><span>SK</span><i></i></button>
      </aside>

    <!-- Account Menu Dropdown -->
    <div id="account-menu" class="dropdown-panel" style="display:none"></div>

    <!-- Apps Menu Dropdown -->
    <div id="apps-menu" class="dropdown-panel" style="display:none"></div>

    <!-- Help Menu -->
    <div id="help-menu" class="dropdown-panel" style="display:none"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar-expanded">
      <div class="sidebar-inner">
        <button id="workspace-switcher" class="workspace-switcher" type="button" aria-label="Switch account"><span class="workspace-icon material-icons-outlined">business</span><span><small>MAIL WORKSPACE</small><strong>CloudMail</strong></span><span class="material-icons-outlined workspace-chevron">expand_more</span></button>
        <button id="compose-btn" class="compose-button" aria-label="Compose new email">
          <span class="material-icons-outlined compose-icon">edit</span>
          <span class="compose-text">Compose</span>
        </button>
        <nav id="sidebar-nav" aria-label="Mail folders"></nav>
        <div id="sidebar-labels" class="sidebar-section"></div>
        <div class="sidebar-footer">
          <div class="storage-info">
            <div class="storage-bar"><div class="storage-fill" style="width: 23%"></div></div>
            <span class="storage-text">3.45 GB of 15 GB used</span>
          </div>
          <div class="sidebar-footer-links">
            <a href="#" data-action="terms">Terms</a> · <a href="#" data-action="privacy">Privacy</a> · <a href="#" data-action="program-policies">Program Policies</a>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay for mobile -->
    <div id="sidebar-overlay" style="display:none"></div>

    <!-- Main Content Area -->
    <main id="main-content">
      <div id="content-area"></div>
    </main>

    <!-- Quick Settings Panel -->
    <div id="quick-settings-panel" style="display:none"></div>
  </div>

  <!-- Compose Window Container (multiple compose windows possible) -->
  <div id="compose-container"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" style="display:none">
    <div id="modal-dialog" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Context Menu -->
  <div id="context-menu" style="display:none" role="menu"></div>

  <!-- Keyboard Shortcuts Overlay -->
  <div id="shortcuts-overlay" style="display:none">
    <div class="shortcuts-dialog">
      <div class="shortcuts-header">
        <h2>Keyboard shortcuts</h2>
        <button class="icon-btn" data-action="close-shortcuts"><span class="material-icons-outlined">close</span></button>
      </div>
      <div class="shortcuts-body" id="shortcuts-body"></div>
    </div>
  </div>

  <!-- Print Frame (hidden) -->
  <iframe id="print-frame" style="display:none" title="Print frame"></iframe>

  <!-- Scripts (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/email.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('load', function() {
      const loadingScreen = document.getElementById('loading-screen');
      const authContainer = document.getElementById('auth-container');
      const appContainer = document.getElementById('app-container');

      // Broken or missing startup scripts must not leave the loading overlay stuck.
      if (authContainer && appContainer &&
          authContainer.style.display === 'none' && appContainer.style.display === 'none') {
        authContainer.className = 'auth-page';
        authContainer.style.display = 'flex';
        authContainer.innerHTML =
          '<section class="auth-card" role="alert">' +
            '<h1 class="auth-title">CloudMail couldn\'t start</h1>' +
            '<p class="auth-subtitle">Some application JavaScript files are missing or failed to load. Check the browser console and make sure js/state.js, js/ui.js, js/email.js, and js/app.js are present.</p>' +
            '<button class="auth-submit" type="button" onclick="window.location.reload()">Reload page</button>' +
          '</section>';
      }

      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        window.setTimeout(function() { loadingScreen.remove(); }, 500);
      }
    }, { once: true });
  </script>
</body>
</html>
